# Named main.yml per the fleet two-file standard (cicd.md), even though this repo has no
# deploy or publish step: it ships through the Claude Code git plugin marketplace, so the
# version bump IS the release and main.yml's job is to prove the tree is green.
#
# runs-on stays ubuntu-latest, deliberately and permanently: this is our one PUBLIC repo, so
# `pull_request` fires for FORKS. Pointing it at the self-hosted pool would let an outsider's
# branch execute on our build box. Public repos also get unlimited free hosted minutes, so
# there is nothing to save. The pre-push hook cannot cover this case either — we do not
# control a fork contributor's machine, which is the one place a CI code check earns its keep.
name: main

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly CodeQL sweep. A scan only on push finds what THIS change introduced; the cron is
    # what catches a newly-published advisory against code that has not been touched. GitHub
    # fires schedule: only from the default branch, which this repo is.
    - cron: '15 3 * * 1'   # Mondays 03:15 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CodeQL lives here rather than in its own codeql.yml so the repo keeps the fleet two-file
# standard (cicd.md). It is FREE on this repo and only this repo: code scanning is billed per
# committer on private repos (~$30/committer/month) and free on public ones. This is our one
# public repo, which also makes it the one strangers can read and fork.
permissions:
  contents: read
  security-events: write   # required for CodeQL to upload its results

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run self-test (no dependencies)
        run: npm test

  codeql:
    # Skipped on the weekly cron only when it would duplicate a push scan; otherwise runs on
    # push, PR (including forks) and the schedule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
